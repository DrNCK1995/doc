services:
  db:
    image: postgres:16
    container_name: growth_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growth_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growth_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growth_monitor_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/growth_monitor?schema=public
      NEXT_PUBLIC_APP_NAME: Dr. Chaitanya Growth Monitor
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_PASSWORD: admin123
      PATIENT_ID_PREFIX: ARJ
      NODE_ENV: production
    volumes:
      - ./data:/app/data:ro

volumes:
  postgres_data:
